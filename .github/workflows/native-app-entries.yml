name: Native application entries
on:
  workflow_dispatch:
  pull_request:
    paths:
    - artifacts/runtime/**
    - artifacts/windows/**
    - tests/test_native_app_entries.py
    - .github/workflows/native-app-entries.yml
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.12
    - name: Verify native applications, icons and ownership
      run: uv run --no-project --python 3.13.15 python tests/test_native_app_entries.py
    - name: Verify Windows local cleanup
      if: runner.os == 'Windows'
      run: uv run --no-project --python 3.13.15 python tests/test_windows_manager_ports.py WindowsManagerContracts.test_offline_uninstall_preserves_data_and_explicit_purge_removes_instance WindowsManagerContracts.test_cleanup_waits_for_parent_handle_and_preserves_reused_pid
