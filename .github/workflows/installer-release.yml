name: Installer from Releases
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: {}
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v0.5.0-insightos.2026.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: installer-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
    - name: Check out workflow implementation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        path: automation
        persist-credentials: false
    - name: Select immutable source ref
      id: target
      env:
        TARGET_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        SOURCE_SHA: ${{ github.sha }}
      run: "if [[ -n \"$TARGET_TAG\" ]]; then\n  [[ \"$TARGET_TAG\" =~ ^v[0-9][0-9A-Za-z._+-]*$ ]] || { echo \"\
        Invalid version tag\" >&2; exit 1; }\n  echo \"ref=refs/tags/$TARGET_TAG\" >> \"$GITHUB_OUTPUT\"\nelse\n\
        \  echo \"ref=$SOURCE_SHA\" >> \"$GITHUB_OUTPUT\"\nfi\necho \"tag=$TARGET_TAG\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Check out component source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.target.outputs.ref }}
        path: source
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: 1.25.8
        cache: false
    - name: Set up uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      with:
        version: 0.12.12
        enable-cache: true
    - name: Install assembly and smoke dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y python3-yaml zstd libegl1 libgl1 libgl1-mesa-dri

        '
    - name: Test release verification and existing installer
      working-directory: automation
      run: 'python3 -m unittest discover -s tests -p test_release_downloads.py

        python3 -m unittest discover -s tests -p test_artifact_installer.py

        python3 -m unittest discover -s tests -p test_artifact_uninstall.py

        go test artifacts/gateway/main.go artifacts/gateway/main_test.go

        '
    - name: Assemble pinned component releases
      env:
        TARGET_TAG: ${{ steps.target.outputs.tag }}
        GH_TOKEN: ${{ github.token }}
      run: 'version="${TARGET_TAG#v}"

        version="${version:-0.0.0-ci}"

        echo "INSTALLER_VERSION=$version" >> "$GITHUB_ENV"

        python3 automation/artifacts/build_from_releases.py --quick-start source --manifest source/repo-versions.json
        --cache "$RUNNER_TEMP/component-releases" --version "$version" --output "source/artifacts/releases/$version/linux-x86_64"

        '
    - name: Install and exercise the assembled package
      run: 'mkdir -p source/artifacts/.build

        python3 source/artifacts/smoke_release.py --package "source/artifacts/releases/$INSTALLER_VERSION/linux-x86_64/semantic-$INSTALLER_VERSION-linux-x86_64.tar.gz"
        --dir "$RUNNER_TEMP/semantic-install-smoke" --port-base 28080

        '
    - name: Upload installer and component lock
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-assets
        path: source/artifacts/releases/${{ env.INSTALLER_VERSION }}/linux-x86_64/*
        if-no-files-found: error
        retention-days: 14
    - name: Upload smoke report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: installer-smoke-report
        path: ${{ runner.temp }}/semantic-install-smoke/smoke-report.json
        if-no-files-found: ignore
        retention-days: 14
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Check out publishing implementation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Download verified component artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: release-assets
        path: release-assets
    - name: Publish tag release
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_TAG: ${{ needs.build.outputs.tag }}
      run: python3 .github/scripts/publish.py
