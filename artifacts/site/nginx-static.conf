server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' https://assets.insightos.cn; media-src https://insightos-artifacts.oss-cn-shanghai.aliyuncs.com; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
    location = /install.sh { default_type text/plain; try_files $uri =404; }
    location = /install-en.sh { default_type text/plain; try_files $uri =404; }
    location ~ /\. { deny all; }
}
