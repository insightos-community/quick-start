# Append to the existing edge default.conf. Keep that bind-mounted file's inode.
server {
    listen 80;
    server_name semantic.example.org;
    return 301 https://semantic.example.org$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name semantic.example.org;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/semantic.access.log;
    error_log /var/log/nginx/semantic.error.log warn;
    # Docker DNS allows the backend to be recreated without an edge reload.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $semantic_backend semantic-static:8080;
    location / {
        proxy_pass http://$semantic_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_cache off;
    }
}
